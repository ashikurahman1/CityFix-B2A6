[build]
  command = "npx prisma generate"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # Prisma ships a native query engine: keep it out of the bundle and ship its files alongside.
  external_node_modules = ["@prisma/client", ".prisma/client"]
  included_files = ["node_modules/.prisma/client/**", "node_modules/@prisma/client/**"]

# Send every request to the Express app running as a function.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
